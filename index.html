<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THMovies - Login</title>
    <style>
        :root {
            --bg: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            --card-bg: #1a1a2e;
            --text: #e0e0ff;
            --accent: #ff4d4d;
            --shadow: rgba(0,0,0,0.6);
        }
        body.light {
            --bg: linear-gradient(135deg, #f0f4ff 0%, #d0d8ff 100%);
            --card-bg: #ffffff;
            --text: #101020;
            --accent: #ff4d4d;
            --shadow: rgba(0,0,0,0.2);
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.4s ease;
        }
        .login-container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px var(--shadow);
            max-width: 420px;
            width: 90%;
            text-align: center;
        }
        h1 {
            color: var(--accent);
            margin-bottom: 20px;
        }
        .warning {
            background: rgba(255, 77, 77, 0.15);
            color: #ff9999;
            padding: 12px;
            border-radius: 12px;
            margin: 15px 0;
            font-size: 0.95rem;
        }
        .warning a {
            color: #ffcccc;
            text-decoration: underline;
            font-weight: bold;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 50px;
            background: rgba(255,255,255,0.1);
            color: var(--text);
            font-size: 1rem;
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            width: 100%;
            font-size: 1.1rem;
        }
        #errorMsg {
            color: #ff6666;
            margin-top: 12px;
            font-weight: bold;
        }
        #themeToggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--card-bg);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--shadow);
            transition: all 0.3s;
        }
        #themeToggle:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>THMovies Login</h1>
        
        <div class="warning">
            <strong>Prima di fare login:</strong><br>
            Scarica e installa <a href="https://chromewebstore.google.com/detail/ublock-origin-lite/ddkjiahejlhfcafbddmgiahcphecmpfh" target="_blank" rel="noopener noreferrer">uBlock Origin Lite</a> 
            per bloccare le pubblicità fastidiose durante la visione!
        </div>

        <input type="text" id="username" placeholder="Username" autocomplete="off">
        <input type="password" id="password" placeholder="Password" autocomplete="off">
        <button id="loginBtn">Accedi</button>
        <div id="errorMsg"></div>
    </div>

    <button id="themeToggle">☀️</button>

    <script>
        const els = {
            username: document.getElementById('username'),
            password: document.getElementById('password'),
            loginBtn: document.getElementById('loginBtn'),
            error: document.getElementById('errorMsg'),
            themeToggle: document.getElementById('themeToggle')
        };

        const obfuscatedCreds = 'eyJ1dGVudGUxIjoiZjkxZTUyZGIzNjUwYTJiMThiMWViOTliN2E3MTdhNWEyYTJhODE3Y2NhZjA5ZWVlNzFlNWEzMjVmZGUwNTMyMDYifQ==';

        async function getHash(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        els.loginBtn.onclick = async () => {
            const user = els.username.value.trim();
            const pass = els.password.value.trim();
            
            if (!user || !pass) {
                els.error.textContent = 'Inserisci username e password!';
                return;
            }

            // Decodifica
            let decoded;
            try {
                decoded = atob(obfuscatedCreds);
                const creds = JSON.parse(decoded);
                
                const inputHash = await getHash(pass);
                if (creds[user] === inputHash) {
                    localStorage.setItem('authenticated', 'true');
                    window.location.href = 'index.html';
                } else {
                    els.error.textContent = 'Credenziali errate!';
                }
            } catch (e) {
                els.error.textContent = 'Errore interno. Riprova.';
            }
        };

        els.themeToggle.onclick = () => {
            document.body.classList.toggle('light');
            els.themeToggle.textContent = document.body.classList.contains('light') ? '🌙' : '☀️';
        };

        window.onload = () => {
            if (localStorage.getItem('authenticated') === 'true') {
                window.location.href = 'index.html';
            }
            els.themeToggle.textContent = '☀️';
        };
    </script>
</body>
</html>
