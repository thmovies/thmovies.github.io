<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THMovies - Login</title>
    <style>
        :root {
            --bg: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            --card-bg: #1a1a2e;
            --text: #e0e0ff;
            --accent: #ff4d4d;
            --shadow: rgba(0,0,0,0.6);
        }
        body.light {
            --bg: linear-gradient(135deg, #f0f4ff 0%, #d0d8ff 100%);
            --card-bg: #ffffff;
            --text: #101020;
            --accent: #ff4d4d;
            --shadow: rgba(0,0,0,0.2);
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px var(--shadow);
            max-width: 420px;
            width: 90%;
            text-align: center;
        }
        h1 {
            color: var(--accent);
            margin-bottom: 20px;
        }
        .warning {
            background: rgba(255, 77, 77, 0.15);
            color: #ff9999;
            padding: 12px;
            border-radius: 12px;
            margin: 15px 0;
            font-size: 0.95rem;
        }
        .warning a {
            color: #ffcccc;
            text-decoration: underline;
            font-weight: bold;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 50px;
            background: rgba(255,255,255,0.1);
            color: var(--text);
            font-size: 1rem;
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            width: 100%;
            font-size: 1.1rem;
        }
        #errorMsg {
            color: #ff6666;
            margin-top: 12px;
            font-weight: bold;
        }
        #themeToggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--card-bg);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--shadow);
        }
    </style>
</head>

<body>

<div class="login-container">
    <img 
      src="logo.png" 
      alt="THMovies Logo" 
      style="max-height: 120px; width: auto;"
    >

    <div class="warning">
        <strong>Prima di fare login:</strong><br>
        Scarica e installa
        <a href="https://chromewebstore.google.com/detail/ublock-origin-lite/ddkjiahejlhfcafbddmgiahcphecmpfh"
           target="_blank" rel="noopener noreferrer">
           uBlock Origin Lite
        </a>
        per bloccare le pubblicità fastidiose durante la visione!
    </div>

    <input type="text" id="username" placeholder="Username" autocomplete="off">
    <input type="password" id="password" placeholder="Password" autocomplete="off">
    <button onclick="login()">Accedi</button>
    <div id="errorMsg"></div>
</div>

<button id="themeToggle">☀️</button>

<script>
const CREDS = "dXRlbnRlMTpndXJtYW4=";

function login() {
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();
    const error = document.getElementById("errorMsg");

    if (!user || !pass) {
        error.textContent = "Inserisci username e password!";
        return;
    }

    const decoded = atob(CREDS);
    const [u, p] = decoded.split(":");

    if (user === u && pass === p) {
        localStorage.setItem("authenticated", "true");
        window.location.href = "home.html";
    } else {
        error.textContent = "Credenziali errate!";
    }
}

document.getElementById("themeToggle").onclick = () => {
    document.body.classList.toggle("light");
    themeToggle.textContent =
        document.body.classList.contains("light") ? "🌙" : "☀️";
};

window.onload = () => {
    if (localStorage.getItem("authenticated") === "true") {
        window.location.href = "home.html";
    }
};
</script>

</body>
</html>
