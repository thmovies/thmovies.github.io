<!DOCTYPE html>
<html lang="it">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta name="description" content="THMovies: Scopri e guarda film, serie TV e anime in streaming. Interfaccia moderna, temi chiaro/scuro e preferiti salvati.">
      <title>THMovies</title>
      <link rel="icon" href="favicon.ico" type="image/x-icon">
      <!-- Assumi che esista un favicon -->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
      <style>
         :root {
         --bg: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
         --card-bg: #1a1a2e;
         --text: #e0e0ff;
         --accent: #ff4d4d;
         --shadow: rgba(0,0,0,0.6);
         --transition: all 0.3s ease;
         }
         body.light {
         --bg: linear-gradient(135deg, #f0f4ff 0%, #d0d8ff 100%);
         --card-bg: #ffffff;
         --text: #101020;
         --accent: #ff4d4d;
         --shadow: rgba(0,0,0,0.2);
         }
         body {
         background: var(--bg);
         color: var(--text);
         font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
         margin: 0;
         min-height: 100vh;
         transition: var(--transition);
         }
         header {
         text-align: center;
         padding: 20px;
         background: rgba(26,26,46,0.9);
         backdrop-filter: blur(10px);
         box-shadow: 0 4px 20px var(--shadow);
         position: sticky;
         top: 0;
         z-index: 10;
         }
         header h1 {
         color: var(--accent);
         font-size: 2.5rem;
         margin: 0;
         text-shadow: 0 2px 10px rgba(255,77,77,0.4);
         animation: glow 3s infinite alternate;
         }
         @keyframes glow {
         from { text-shadow: 0 0 5px rgba(255,77,77,0.4); }
         to { text-shadow: 0 0 15px rgba(255,77,77,0.8); }
         }
         .nav {
         display: flex;
         justify-content: center;
         gap: 10px;
         margin: 15px 0;
         flex-wrap: wrap;
         }
         .nav button {
         background: var(--card-bg);
         border: none;
         padding: 10px 25px;
         color: var(--text);
         font-weight: 600;
         border-radius: 50px;
         cursor: pointer;
         transition: var(--transition);
         box-shadow: 0 4px 15px var(--shadow);
         }
         .nav button.active {
         background: var(--accent);
         color: white;
         transform: scale(1.05);
         box-shadow: 0 6px 25px rgba(255,77,77,0.5);
         }
         .nav button:hover {
         transform: scale(1.1);
         }
         .section {
         display: none;
         padding: 0 15px;
         max-width: 1400px;
         margin: 0 auto;
         animation: fadeIn 0.5s ease-in-out;
         }
         .section.active {
         display: block;
         }
         @keyframes fadeIn {
         from { opacity: 0; transform: translateY(20px); }
         to { opacity: 1; transform: translateY(0); }
         }
         .search-container {
         position: relative;
         margin: 15px 0;
         }
         input[type="text"] {
         width: 100%;
         padding: 12px 45px 12px 15px;
         border: none;
         border-radius: 50px;
         background: var(--card-bg);
         color: var(--text);
         font-size: 1rem;
         box-shadow: 0 4px 15px var(--shadow);
         transition: var(--transition);
         }
         input[type="text"]:focus {
         outline: none;
         box-shadow: 0 0 10px var(--accent);
         }
         .clear-btn {
         position: absolute;
         right: 15px;
         top: 50%;
         transform: translateY(-50%);
         background: none;
         border: none;
         color: var(--text);
         font-size: 1.3rem;
         cursor: pointer;
         opacity: 0.6;
         display: none;
         transition: var(--transition);
         }
         .clear-btn:hover {
         opacity: 1;
         transform: translateY(-50%) rotate(90deg);
         }
         .results {
         display: grid;
         grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
         gap: 15px;
         padding: 15px;
         background: rgba(26,26,46,0.2);
         border-radius: 15px;
         overflow-y: auto;
         }
         .card {
         background: var(--card-bg);
         border-radius: 12px;
         overflow: hidden;
         box-shadow: 0 6px 20px var(--shadow);
         transition: var(--transition);
         cursor: pointer;
         position: relative;
         opacity: 0;
         transform: translateY(20px);
         animation: cardFadeIn 0.4s ease-out forwards;
         }
         @keyframes cardFadeIn {
         to { opacity: 1; transform: translateY(0); }
         }
         .card:hover {
         transform: translateY(-8px);
         box-shadow: 0 12px 30px rgba(255,77,77,0.3);
         }
         .card.selected, .card[aria-selected="true"] {
         border: 2px solid var(--accent);
         }
         .card img {
         width: 100%;
         height: 240px;
         object-fit: cover;
         transition: var(--transition);
         loading: lazy; /* Lazy loading per performance */
         }
         .card:hover img {
         transform: scale(1.03);
         }
         .card-info {
         padding: 10px;
         text-align: center;
         }
         .card h3 {
         font-size: 0.95rem;
         margin: 6px 0 3px;
         height: 2.2em;
         overflow: hidden;
         text-overflow: ellipsis;
         }
         .card .meta {
         font-size: 0.8rem;
         color: #bbbbbb;
         }
         .fav-btn {
         background: none;
         border: none;
         color: var(--accent);
         cursor: pointer;
         position: absolute;
         top: 8px;
         right: 8px;
         font-size: 1.2rem;
         }
         .episode-selector {
         display: flex;
         gap: 10px;
         margin: 15px 0;
         flex-wrap: wrap;
         justify-content: center;
         }
         .episode-selector select {
         padding: 10px 18px;
         border-radius: 50px;
         border: none;
         background: var(--card-bg);
         color: var(--text);
         font-size: 0.95rem;
         min-width: 180px;
         cursor: pointer;
         transition: var(--transition);
         }
         .episode-selector select:focus {
         outline: none;
         box-shadow: 0 0 8px var(--accent);
         }
         /* Rules Overlay */
         .rules-overlay {
         position: fixed;
         inset: 0;
         background: rgba(0, 0, 0, 0.95);
         z-index: 99999;
         display: none;
         align-items: center;
         justify-content: center;
         backdrop-filter: blur(10px);
         }
         .rules-overlay.active {
         display: flex;
         }
         .rules-box {
         background: linear-gradient(135deg, #1a0026 0%, #0b0015 100%);
         color: #ffd700;
         width: 90%;
         max-width: 600px;
         padding: 40px 30px;
         border-radius: 15px;
         border: 3px solid #ff4500;
         box-shadow: 0 0 60px rgba(255, 69, 0, 0.6), inset 0 0 20px rgba(255, 140, 0, 0.2);
         text-align: center;
         position: relative;
         animation: popup 0.5s ease-out;
         }
         @keyframes popup {
         0% { transform: scale(0.8); opacity: 0; }
         100% { transform: scale(1); opacity: 1; }
         }
         .rules-box h2 {
         font-family: 'Orbitron', sans-serif; /* Assumi font caricato se necessario */
         font-size: 2.8rem;
         margin: 0 0 30px;
         background: linear-gradient(90deg, #ffd700, #ff8c00, #ff4500);
         -webkit-background-clip: text;
         -webkit-text-fill-color: transparent;
         text-shadow: 0 0 12px #ff4500;
         }
         .rules-box ul {
         list-style: none;
         padding: 0;
         margin: 0 0 35px;
         font-size: 1.1rem;
         line-height: 1.8;
         text-align: left;
         }
         .rules-box li {
         margin: 15px 0;
         padding-left: 40px;
         position: relative;
         transition: var(--transition);
         }
         .rules-box li:hover {
         transform: translateX(4px);
         }
         .rules-box li::before {
         content: "⛔";
         position: absolute;
         left: 0;
         top: 2px;
         font-size: 1.4rem;
         }
         .close-rules-btn {
         background: linear-gradient(90deg, #ff4500, #ff8c00);
         color: white;
         border: none;
         padding: 15px 70px;
         border-radius: 50px;
         font-size: 1.2rem;
         font-weight: bold;
         cursor: pointer;
         box-shadow: 0 6px 20px rgba(255, 69, 0, 0.5);
         transition: var(--transition);
         }
         .close-rules-btn:hover {
         transform: scale(1.05);
         box-shadow: 0 10px 30px rgba(255, 69, 0, 0.8);
         }
         #playBtn, #retryBtn, #openTab, #trailerBtn {
         width: 100%;
         max-width: 350px;
         margin: 8px auto;
         padding: 14px;
         border: none;
         border-radius: 50px;
         font-size: 1.1rem;
         font-weight: 600;
         cursor: pointer;
         transition: var(--transition);
         display: block;
         }
         #playBtn {
         background: var(--accent);
         color: white;
         }
         #playBtn:disabled {
         background: #666;
         cursor: not-allowed;
         }
         #retryBtn {
         background: #555;
         color: white;
         }
         #openTab {
         background: #777;
         color: white;
         }
         #trailerBtn {
         background: linear-gradient(90deg, #ff8c00, #ffd700);
         color: #1a1a2e;
         display: none;
         }
         #trailerBtn:disabled {
         background: #999;
         cursor: not-allowed;
         }
         .player-container {
         position: relative;
         padding-top: 56.25%;
         border-radius: 15px;
         overflow: hidden;
         background: #000;
         margin: 25px 0;
         box-shadow: 0 8px 30px var(--shadow);
         }
         iframe {
         position: absolute;
         top: 0;
         left: 0;
         width: 100%;
         height: 100%;
         border: none;
         }
         .loading {
         position: absolute;
         inset: 0;
         background: rgba(0,0,0,0.85);
         display: flex;
         align-items: center;
         justify-content: center;
         color: white;
         font-size: 1.2rem;
         z-index: 10;
         pointer-events: none;
         }
         .loading i {
         animation: spin 1s linear infinite;
         }
         @keyframes spin {
         0% { transform: rotate(0deg); }
         100% { transform: rotate(360deg); }
         }
         .status, .error {
         text-align: center;
         padding: 12px;
         border-radius: 12px;
         margin: 12px 0;
         font-weight: 600;
         }
         .status {
         background: rgba(0,255,0,0.15);
         color: #0f0;
         }
         .error {
         background: rgba(255,0,0,0.15);
         color: #f00;
         }
         #themeToggle {
         position: fixed;
         bottom: 15px;
         right: 15px;
         background: var(--card-bg);
         border: none;
         width: 45px;
         height: 45px;
         border-radius: 50%;
         font-size: 1.3rem;
         cursor: pointer;
         box-shadow: 0 4px 15px var(--shadow);
         transition: var(--transition);
         }
         #themeToggle:hover {
         transform: scale(1.1) rotate(15deg);
         }
         /* Trailer Modal */
         #trailerModal {
         position: fixed;
         inset: 0;
         background: rgba(0,0,0,0.95);
         display: none;
         align-items: center;
         justify-content: center;
         z-index: 9999;
         }
         #trailerModal.active {
         display: flex;
         }
         .trailer-content {
         position: relative;
         width: 85%;
         max-width: 900px;
         background: #000;
         border-radius: 15px;
         overflow: hidden;
         }
         .trailer-content::before {
         content: '';
         display: block;
         padding-top: 56.25%; /* 16:9 */
         }
         .trailer-content iframe {
         position: absolute;
         top: 0;
         left: 0;
         width: 100%;
         height: 100%;
         }
         .close-trailer {
         position: absolute;
         top: 8px;
         right: 8px;
         background: none;
         border: none;
         color: white;
         font-size: 1.8rem;
         cursor: pointer;
         z-index: 1;
         }
         /* Favorites */
         .favorites {
         margin: 15px 0;
         padding: 15px;
         background: rgba(26,26,46,0.3);
         border-radius: 15px;
         }
         .favorites h2 {
         text-align: center;
         margin-bottom: 15px;
         }
         /* Accessibility Improvements */
         button, input, select {
         outline-offset: 2px;
         }
         .hidden {
         display: none !important;
         }
         /* Media Queries for Better Responsiveness */
         @media (min-width: 768px) {
         .results {
         grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
         gap: 20px;
         }
         .card img {
         height: 270px;
         }
         header {
         padding: 30px 20px;
         }
         header h1 {
         font-size: 3rem;
         }
         }
         @media (max-width: 480px) {
         .nav {
         gap: 8px;
         }
         .nav button {
         padding: 8px 20px;
         }
         .episode-selector select {
         min-width: 150px;
         }
         }
      </style>
   </head>
   <body>
      <header>
         <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <img src="logo.png" alt="THMovies Logo" style="max-height: 100px; width: auto; transition: var(--transition);">
            <div id="logoutContainer" style="display: none;">
               <button onclick="logout()" style="background: linear-gradient(90deg, #ff4500, #ff8c00); color: white; border: none; padding: 10px 35px; border-radius: 50px; font-size: 1rem; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(255,69,0,0.4); transition: var(--transition);" aria-label="Logout">LOGOUT</button>
            </div>
         </div>
      </header>
      <nav class="nav">
         <button data-type="movie" class="tab active" aria-pressed="true">Film</button>
         <button data-type="tv" class="tab" aria-pressed="false">Serie TV</button>
         <button data-type="anime" class="tab" aria-pressed="false">Anime</button>
      </nav>
      <section id="movieSection" class="section active" role="tabpanel" aria-labelledby="movie-tab">
         <div class="search-container">
            <input type="text" id="movieSearch" placeholder="Cerca film..." aria-label="Cerca film">
            <button class="clear-btn" id="clearMovie" aria-label="Pulisci ricerca">×</button>
         </div>
         <div id="movieResults" class="results"></div>
         <div id="movieLangSelector" class="episode-selector hidden">
            <select id="movieLangSelect" aria-label="Seleziona lingua">
               <option value="">Auto</option>
               <option value="?lang=en">English</option>
               <option value="?lang=it">Italian</option>
            </select>
         </div>
      </section>
      <section id="tvSection" class="section" role="tabpanel" aria-labelledby="tv-tab">
         <div class="search-container">
            <input type="text" id="tvSearch" placeholder="Cerca serie TV..." aria-label="Cerca serie TV">
            <button class="clear-btn" id="clearTv" aria-label="Pulisci ricerca">×</button>
         </div>
         <div id="tvResults" class="results"></div>
         <div id="tvEpisodeSelector" class="episode-selector hidden">
            <select id="seasonSelect" aria-label="Seleziona stagione">
               <option>Stagione...</option>
            </select>
            <select id="episodeSelect" aria-label="Seleziona episodio">
               <option>Episodio...</option>
            </select>
            <select id="tvLangSelect" aria-label="Seleziona lingua">
               <option value="">Auto</option>
               <option value="?lang=en">English</option>
               <option value="?lang=it">Italian</option>
            </select>
         </div>
      </section>
      <section id="animeSection" class="section" role="tabpanel" aria-labelledby="anime-tab">
         <div class="search-container">
            <input type="text" id="animeSearch" placeholder="Cerca anime..." aria-label="Cerca anime">
            <button class="clear-btn" id="clearAnime" aria-label="Pulisci ricerca">×</button>
         </div>
         <div id="animeResults" class="results"></div>
         <div id="animeEpisodeSelector" class="episode-selector hidden">
            <select id="animeSeasonSelect" aria-label="Seleziona stagione">
               <option>Stagione...</option>
            </select>
            <select id="animeEpSelect" aria-label="Seleziona episodio">
               <option>Episodio...</option>
            </select>
            <select id="animeLangSelect" aria-label="Seleziona lingua">
               <option value="">Auto</option>
               <option value="?dub=1">English Dub</option>
               <option value="?sub=1">English Sub</option>
               <option value="?lang=ja">Japanese</option>
            </select>
         </div>
      </section>
      <section id="favoritesSection" class="favorites" aria-labelledby="favorites-heading">
         <h2 id="favorites-heading">I tuoi preferiti</h2>
         <div id="favoritesList" class="results"></div>
      </section>
      <button id="playBtn" disabled aria-label="Riproduci">▶ Riproduci</button>
      <button id="trailerBtn" disabled aria-label="Guarda Trailer">📹 Guarda Trailer</button>
      <button id="retryBtn" style="display: none;" aria-label="Riprova">Riprova</button>
      <button id="openTab" style="display: none;" aria-label="Apri in nuova scheda">Nuova scheda</button>
      <div id="statusMsg" class="status" role="status" aria-live="polite"></div>
      <div id="errorMsg" class="error" role="alert" aria-live="assertive"></div>
      <div class="player-container">
         <div id="loading" class="loading" style="display: none;"><i class="fas fa-spinner"></i> Caricamento...</div>
         <iframe id="player" allowfullscreen allow="autoplay; encrypted-media; fullscreen; picture-in-picture"></iframe>
      </div>
      <!-- Trailer Modal -->
      <div id="trailerModal" role="dialog" aria-modal="true" aria-labelledby="trailer-title">
         <div class="trailer-content">
            <button class="close-trailer" onclick="closeTrailer()" aria-label="Chiudi trailer">×</button>
            <iframe id="trailerPlayer" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"></iframe>
         </div>
      </div>
      <!-- Rules Overlay -->
      <div id="rulesOverlay" class="rules-overlay">
         <div class="rules-box" role="dialog" aria-modal="true" aria-labelledby="rules-title">
            <h2 id="rules-title">REGOLE DI THMOVIES</h2>
            <ul>
               <li>Regola 1: non parlare di THMovies.</li>
               <li>Regola 2: NON parlare di THMovies.</li>
               <li>Regola 3: Scarica e usa l'ad blocker</li>
            </ul>
            <button class="close-rules-btn" onclick="closeRulesOverlay()" aria-label="Ho capito – Chiudi">HO CAPITO – CHIUDI</button>
         </div>
      </div>
      <button id="themeToggle" aria-label="Cambia tema">☀️</button>
      <script>
         // Nota: Il token TMDB è esposto client-side, considera di muoverlo server-side per sicurezza in produzione.
         const TMDB_TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiI0ZTExOGZjMThjNDdiZGU3ODc1ZDY0MGRlMGE4ZWQzMiIsIm5iZiI6MTc2ODkxMDYwOC4xNTM5OTk4LCJzdWIiOiI2OTZmNmYxMDViN2EyMjEzMTlmZTEwZTMiLCJzY29wZXMiOlsiYXBpX3JlYWQiXSwidmVyc2lvbiI6MX0.byUoqZfilhnXxG6u41zxVIpnQ8Z3J4UqSzuGmDQHaPA';
         const tmdbHeaders = {
             Authorization: `Bearer ${TMDB_TOKEN}`,
             'Content-Type': 'application/json;charset=utf-8'
         };
         
         const PROVIDERS = {
             movie: [
                 (id, lang) => `https://vidsrc.to/embed/movie/${id}${lang}`,
                 (id, lang) => `https://vidsrc.pro/embed/${id}${lang}`,
                 (id, lang) => `https://autoembed.cc/movie/${id}${lang ? `&${lang.slice(1)}` : ''}`,
                 (id, lang) => `https://vidsrc.in/embed/movie?tmdb=${id}${lang}`,
                 (id, lang) => `https://multiembed.mov/?video_id=${id}&tmdb=1${lang}`
             ],
             tv: [
                 (id, s, e, lang) => `https://vidsrc.to/embed/tv/${id}/${s}/${e}${lang}`,
                 (id, s, e, lang) => `https://vidsrc.pro/embed/${id}/${s}/${e}${lang}`,
                 (id, s, e, lang) => `https://autoembed.cc/tv/${id}/${s}/${e}${lang ? `&${lang.slice(1)}` : ''}`,
                 (id, s, e, lang) => `https://vidsrc.in/embed/tv?tmdb=${id}&season=${s}&episode=${e}${lang}`,
                 (id, s, e, lang) => `https://multiembed.mov/?video_id=${id}&tmdb=1&s=${s}&e=${e}${lang}`
             ],
             anime: [
                 (id, s, e, lang) => `https://vidsrc.to/embed/tv/${id}/${s}/${e}${lang}`,
                 (id, s, e, lang) => `https://vidsrc.pro/embed/${id}/${s}/${e}${lang}`,
                 (id, s, e, lang) => `https://autoembed.cc/tv/${id}/${s}/${e}${lang ? `&${lang.slice(1)}` : ''}`,
                 (id, s, e, lang) => `https://vidsrc.in/embed/tv?tmdb=${id}&season=${s}&episode=${e}${lang}`,
                 (id, s, e, lang) => `https://multiembed.mov/?video_id=${id}&tmdb=1&s=${s}&e=${e}${lang}`
             ]
         };
         
         // Stato
         let currentType = 'movie';
         let selected = { id: null, season: 1, episode: 1, lang: '', trailerKey: null };
         let currentProviderIndex = 0;
         
         // Elementi DOM
         const els = {
             tabs: document.querySelectorAll('.nav button'),
             sections: document.querySelectorAll('.section'),
             search: {
                 movie: document.getElementById('movieSearch'),
                 tv: document.getElementById('tvSearch'),
                 anime: document.getElementById('animeSearch')
             },
             clear: {
                 movie: document.getElementById('clearMovie'),
                 tv: document.getElementById('clearTv'),
                 anime: document.getElementById('clearAnime')
             },
             results: {
                 movie: document.getElementById('movieResults'),
                 tv: document.getElementById('tvResults'),
                 anime: document.getElementById('animeResults')
             },
             episodeSelectors: {
                 movie: document.getElementById('movieLangSelector'),
                 tv: document.getElementById('tvEpisodeSelector'),
                 anime: document.getElementById('animeEpisodeSelector')
             },
             season: {
                 tv: document.getElementById('seasonSelect'),
                 anime: document.getElementById('animeSeasonSelect')
             },
             episode: {
                 tv: document.getElementById('episodeSelect'),
                 anime: document.getElementById('animeEpSelect')
             },
             lang: {
                 movie: document.getElementById('movieLangSelect'),
                 tv: document.getElementById('tvLangSelect'),
                 anime: document.getElementById('animeLangSelect')
             },
             playBtn: document.getElementById('playBtn'),
             trailerBtn: document.getElementById('trailerBtn'),
             retryBtn: document.getElementById('retryBtn'),
             openTab: document.getElementById('openTab'),
             player: document.getElementById('player'),
             loading: document.getElementById('loading'),
             status: document.getElementById('statusMsg'),
             error: document.getElementById('errorMsg'),
             themeToggle: document.getElementById('themeToggle'),
             favoritesList: document.getElementById('favoritesList'),
             trailerModal: document.getElementById('trailerModal'),
             trailerPlayer: document.getElementById('trailerPlayer'),
             logoutContainer: document.getElementById('logoutContainer'),
             rulesOverlay: document.getElementById('rulesOverlay')
         };
         
         // Controllo autenticazione
         if (localStorage.getItem('authenticated') !== 'true') {
             alert('Devi fare login prima di accedere!');
             location.href = 'index.html';
         } else {
             els.logoutContainer.style.display = 'block';
             if (localStorage.getItem('showRulesOnLoad') === 'true') {
                 setTimeout(() => els.rulesOverlay.classList.add('active'), 500);
             }
         }
         
         // Funzioni utility
         function showError(msg) {
             els.error.textContent = msg;
             els.status.textContent = '';
         }
         
         function showStatus(msg) {
             els.status.textContent = msg;
             els.error.textContent = '';
         }
         
         function showLoading(show) {
             els.loading.style.display = show ? 'flex' : 'none';
         }
         
         function clearPlayer() {
             els.player.src = '';
             els.playBtn.disabled = true;
             els.trailerBtn.style.display = 'none';
             els.retryBtn.style.display = 'none';
             els.openTab.style.display = 'none';
             showLoading(false);
         }
         
         async function tmdbFetch(url) {
             try {
                 const res = await fetch(url, { headers: tmdbHeaders });
                 if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                 return await res.json();
             } catch (e) {
                 console.error('TMDB fetch error:', e);
                 showError('Errore nella connessione API. Riprova più tardi.');
                 return null;
             }
         }
         
         function createCard(poster, title, date, vote, onClick, id, type, isFavorite = false) {
             const card = document.createElement('div');
             card.className = 'card';
             card.setAttribute('aria-selected', 'false');
             card.setAttribute('role', 'button');
             card.setAttribute('tabindex', '0'); // Keyboard navigable
         
             const img = document.createElement('img');
             img.src = poster ? `https://image.tmdb.org/t/p/w200${poster}` : 'https://via.placeholder.com/180x270?text=N/A';
             img.alt = `Poster di ${title}`;
             img.loading = 'lazy';
         
             const info = document.createElement('div');
             info.className = 'card-info';
         
             const h3 = document.createElement('h3');
             h3.textContent = title;
         
             const p = document.createElement('p');
             p.className = 'meta';
             p.textContent = `${date?.slice(0,4) || 'N/D'} • ★ ${vote?.toFixed(1) || 'N/D'}`;
         
             const favBtn = document.createElement('button');
             favBtn.className = 'fav-btn';
             favBtn.innerHTML = isFavorite ? '<i class="fas fa-heart"></i>' : '<i class="far fa-heart"></i>';
             favBtn.setAttribute('aria-label', isFavorite ? 'Rimuovi dai preferiti' : 'Aggiungi ai preferiti');
             favBtn.onclick = (e) => {
                 e.stopPropagation();
                 toggleFavorite(id, type, title, poster, date);
             };
         
             info.append(h3, p);
             card.append(img, info, favBtn);
             card.onclick = onClick;
             card.onkeydown = (e) => {
                 if (e.key === 'Enter' || e.key === ' ') {
                     onClick();
                 }
             };
         
             return card;
         }
         
         async function searchMedia(type, query) {
             if (!query.trim()) return;
             const resultsEl = els.results[type];
             resultsEl.innerHTML = '<p style="text-align:center;color:#aaa;">Caricamento...</p>';
             const endpoint = type === 'movie' ? 'movie' : 'tv';
             let extra = '';
             if (type === 'anime') extra = '&with_genres=16&with_keywords=210024&with_original_language=ja'; // Migliorato per anime giapponesi
             const url = `https://api.themoviedb.org/3/search/${endpoint}?query=${encodeURIComponent(query)}&language=it-IT${extra}`;
             const data = await tmdbFetch(url);
             resultsEl.innerHTML = '';
             if (!data?.results?.length) {
                 resultsEl.innerHTML = '<p style="text-align:center;color:#aaa;">Nessun risultato trovato. Prova termini diversi.</p>';
                 return;
             }
             // Ordina per popolarità
             data.results.sort((a, b) => b.popularity - a.popularity).slice(0, 20).forEach((item, index) => { // Aumentato a 20 per più risultati
                 const isFav = isFavorite(item.id, type);
                 const card = createCard(item.poster_path, item.title || item.name, item.release_date || item.first_air_date, item.vote_average, () => selectMedia(type, item.id), item.id, type, isFav);
                 card.style.animationDelay = `${index * 0.05}s`; // Animazione più fluida
                 resultsEl.appendChild(card);
             });
         }
         
         async function selectMedia(type, id) {
             selected = { id, season: 1, episode: 1, lang: '', trailerKey: null };
             clearPlayer();
             showStatus('Titolo selezionato con successo.');
             document.querySelectorAll('.card').forEach(c => c.setAttribute('aria-selected', 'false'));
             event?.target.closest('.card')?.setAttribute('aria-selected', 'true');
             const endpoint = type === 'movie' ? 'movie' : 'tv';
             const details = await tmdbFetch(`https://api.themoviedb.org/3/${endpoint}/${id}?language=it-IT`);
             const videos = await tmdbFetch(`https://api.themoviedb.org/3/${endpoint}/${id}/videos?language=it-IT`); // Cambiato a it-IT per trailer locali se disponibili
             if (videos?.results?.length) {
                 const trailer = videos.results.find(v => v.type === 'Trailer' && v.site === 'YouTube');
                 if (trailer) {
                     selected.trailerKey = trailer.key;
                     els.trailerBtn.style.display = 'block';
                     els.trailerBtn.disabled = false;
                }
             }
             const box = els.episodeSelectors[type];
             box.classList.remove('hidden');
             if (type === 'movie') {
                 els.playBtn.disabled = false;
             } else {
                 if (!details?.seasons) return;
                 const seasonSelect = els.season[type];
                 seasonSelect.innerHTML = '<option>Stagione...</option>';
                 details.seasons.filter(s => s.season_number > 0).forEach(s => {
                     const opt = document.createElement('option');
                     opt.value = s.season_number;
                     opt.text = `Stagione ${s.season_number} (${s.episode_count} ep.)`;
                     seasonSelect.appendChild(opt);
                 });
                 await updateEpisodes(type);
                 els.playBtn.disabled = false;
             }
         }
         
         async function updateEpisodes(type) {
             const id = selected.id;
             const season = els.season[type].value;
             if (!season) return;
             const data = await tmdbFetch(`https://api.themoviedb.org/3/tv/${id}/season/${season}?language=it-IT`);
             if (!data?.episodes) return;
             const epSelect = els.episode[type];
             epSelect.innerHTML = '<option>Episodio...</option>';
             data.episodes.forEach(ep => {
                 const opt = document.createElement('option');
                 opt.value = ep.episode_number;
                 opt.text = `Ep. ${ep.episode_number}: ${ep.name || 'Senza titolo'} (${ep.runtime ? `${ep.runtime}m` : 'N/D'})`;
                 epSelect.appendChild(opt);
             });
             selected.season = parseInt(season, 10);
             selected.episode = 1;
             epSelect.value = 1;
         }
         
         async function loadPlayer(startIndex = 0) {
             if (!selected.id) return showError('Seleziona un titolo prima!');
             if (currentType !== 'movie' && (!selected.season || !selected.episode)) return showError('Seleziona stagione ed episodio!');
             showLoading(true);
             const providerList = PROVIDERS[currentType];
             let success = false;
             currentProviderIndex = startIndex;
             for (let i = currentProviderIndex; i < providerList.length; i++) {
                 currentProviderIndex = i;
                 const url = currentType === 'movie'
                     ? providerList[i](selected.id, selected.lang)
                     : providerList[i](selected.id, selected.season, selected.episode, selected.lang);
                 const providerName = new URL(url).hostname.replace('www.', '');
                 showStatus(`Tentativo con ${providerName} (${i + 1}/${providerList.length})...`);
                 els.player.src = url;
                 els.openTab.onclick = () => window.open(url, '_blank');
                 try {
                     await new Promise((resolve, reject) => {
                         const timeout = setTimeout(() => reject('Timeout caricamento'), 15000); // Aumentato timeout
                         els.player.onload = () => {
                             clearTimeout(timeout);
                             setTimeout(resolve, 2000); // Delay per assicurare caricamento
                         };
                         els.player.onerror = () => {
                             clearTimeout(timeout);
                             reject('Errore iframe');
                         };
                     });
                     success = true;
                     showStatus(`Caricato da ${providerName}! Se non parte, prova "Riprova" o "Nuova scheda".`);
                     break;
                 } catch (err) {
                     showError(`${providerName} non riuscito (${err}). Provo il successivo...`);
                 }
             }
             showLoading(false);
             els.retryBtn.style.display = 'block';
             els.openTab.style.display = 'block';
             if (!success) {
                 showError('Tutti i provider hanno fallito. Prova un altro titolo o riprova più tardi.');
                 currentProviderIndex = 0;
             }
         }
         
         function showTrailer() {
             if (!selected.trailerKey) return;
             els.trailerPlayer.src = `https://www.youtube.com/embed/${selected.trailerKey}?autoplay=1&rel=0&modestbranding=1&controls=1`;
             els.trailerModal.classList.add('active');
             els.trailerModal.focus(); // Migliora accessibilità
         }
         
         function closeTrailer() {
             els.trailerModal.classList.remove('active');
             els.trailerPlayer.src = '';
         }
         
         function logout() {
             if (confirm('Sicuro di voler effettuare il logout?')) {
                 localStorage.removeItem('authenticated');
                 localStorage.removeItem('showRulesOnLoad');
                 window.location.href = 'index.html';
             }
         }
         
         function closeRulesOverlay() {
             els.rulesOverlay.classList.remove('active');
             localStorage.removeItem('showRulesOnLoad');
         }
         
         // Gestione preferiti
         function getFavorites() {
             return JSON.parse(localStorage.getItem('favorites') || '[]');
         }
         
         function saveFavorites(favs) {
             localStorage.setItem('favorites', JSON.stringify(favs));
         }
         
         function isFavorite(id, type) {
             return getFavorites().some(f => f.id === id && f.type === type);
         }
         
         function toggleFavorite(id, type, title, poster, date) {
             let favs = getFavorites();
             const index = favs.findIndex(f => f.id === id && f.type === type);
             if (index > -1) {
                 favs.splice(index, 1);
                 showStatus('Rimosso dai preferiti.');
             } else {
                 favs.push({ id, type, title, poster, date });
                 showStatus('Aggiunto ai preferiti!');
             }
             saveFavorites(favs);
             loadFavorites();
             // Aggiorna ricerca corrente se aperta
             const searchInput = els.search[currentType];
             if (searchInput?.value) searchMedia(currentType, searchInput.value);
         }
         
         function loadFavorites() {
             const favs = getFavorites();
             els.favoritesList.innerHTML = '';
             if (!favs.length) {
                 els.favoritesList.innerHTML = '<p style="text-align:center;color:#aaa;">Nessun preferito aggiunto.</p>';
                 return;
             }
             favs.forEach((f, index) => {
                 const card = createCard(f.poster, f.title, f.date, null, () => selectMedia(f.type, f.id), f.id, f.type, true);
                 card.style.animationDelay = `${index * 0.05}s`;
                 els.favoritesList.appendChild(card);
             });
         }
         
         // Listener eventi
         els.tabs.forEach(btn => {
             btn.onclick = () => {
                 els.tabs.forEach(b => {
                     b.classList.remove('active');
                     b.setAttribute('aria-pressed', 'false');
                 });
                 els.sections.forEach(s => s.classList.remove('active'));
                 btn.classList.add('active');
                 btn.setAttribute('aria-pressed', 'true');
                 const type = btn.dataset.type;
                 document.getElementById(`${type}Section`).classList.add('active');
                 currentType = type;
                 clearPlayer();
                 showError('');
                 showStatus('');
                 selected = { id: null, season: 1, episode: 1, lang: '', trailerKey: null };
                 Object.values(els.episodeSelectors).forEach(el => el.classList.add('hidden'));
             };
         });
         
         ['movie', 'tv', 'anime'].forEach(type => {
             const input = els.search[type];
             const clear = els.clear[type];
             let debounceTimer;
             input.oninput = () => {
                 clear.style.display = input.value.trim() ? 'block' : 'none';
                 clearTimeout(debounceTimer);
                 debounceTimer = setTimeout(() => searchMedia(type, input.value.trim()), 500); // Debounce ottimizzato
             };
             clear.onclick = () => {
                 input.value = '';
                 clear.style.display = 'none';
                 els.results[type].innerHTML = '';
             };
         });
         
         els.season.tv.onchange = () => updateEpisodes('tv');
         els.season.anime.onchange = () => updateEpisodes('anime');
         els.episode.tv.onchange = () => selected.episode = parseInt(els.episode.tv.value, 10);
         els.episode.anime.onchange = () => selected.episode = parseInt(els.episode.anime.value, 10);
         
         Object.values(els.lang).forEach(select => {
             if (select) {
                 select.onchange = () => {
                     selected.lang = select.value;
                     if (els.player.src) loadPlayer(currentProviderIndex); // Ricarica con nuova lingua
                 };
             }
         });
         
         els.playBtn.onclick = () => {
             currentProviderIndex = 0;
             loadPlayer(0);
         };
         
         els.trailerBtn.onclick = showTrailer;
         
         els.retryBtn.onclick = () => {
             const nextIndex = (currentProviderIndex + 1) % PROVIDERS[currentType].length;
             loadPlayer(nextIndex);
         };
         
         els.themeToggle.onclick = () => {
             document.body.classList.toggle('light');
             const isLight = document.body.classList.contains('light');
             els.themeToggle.textContent = isLight ? '🌙' : '☀️';
             localStorage.setItem('theme', isLight ? 'light' : 'dark');
         };
         
         els.trailerModal.addEventListener('click', (e) => {
             if (e.target === els.trailerModal) closeTrailer();
         });
         
         // Inizializzazione
         window.addEventListener('load', () => {
             const savedTheme = localStorage.getItem('theme');
             if (savedTheme === 'light') {
                 document.body.classList.add('light');
                 els.themeToggle.textContent = '🌙';
             } else {
                 els.themeToggle.textContent = '☀️';
             }
             loadFavorites();
         });
         
         // Aggiungi supporto per tastiera al modal
         els.trailerModal.addEventListener('keydown', (e) => {
             if (e.key === 'Escape') closeTrailer();
         });
         
         els.rulesOverlay.addEventListener('keydown', (e) => {
             if (e.key === 'Escape') closeRulesOverlay();
         });
      </script>
   </body>
</html>
