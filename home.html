<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THMovies</title>
    <style>
        :root {
            --bg: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            --card-bg: #1a1a2e;
            --text: #e0e0ff;
            --accent: #ff4d4d;
            --shadow: rgba(0,0,0,0.6);
        }
        body.light {
            --bg: linear-gradient(135deg, #f0f4ff 0%, #d0d8ff 100%);
            --card-bg: #ffffff;
            --text: #101020;
            --accent: #ff4d4d;
            --shadow: rgba(0,0,0,0.2);
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, sans-serif;
            margin: 0;
            min-height: 100vh;
            transition: background 0.4s ease;
        }
        header {
            text-align: center;
            padding: 30px 20px;
            background: rgba(26,26,46,0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px var(--shadow);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        header h1 {
            color: var(--accent);
            font-size: 3rem;
            margin: 0;
            text-shadow: 0 2px 10px rgba(255,77,77,0.4);
        }
        .nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .nav button {
            background: var(--card-bg);
            border: none;
            padding: 12px 28px;
            color: var(--text);
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px var(--shadow);
        }
        .nav button.active {
            background: var(--accent);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(255,77,77,0.5);
        }
        .section {
            display: none;
            padding: 0 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .section.active {
            display: block;
        }
        .search-container {
            position: relative;
            margin: 20px 0;
        }
        input[type="text"] {
            width: 100%;
            padding: 15px 50px 15px 20px;
            border: none;
            border-radius: 50px;
            background: var(--card-bg);
            color: var(--text);
            font-size: 1.1rem;
            box-shadow: 0 4px 15px var(--shadow);
        }
        .clear-btn {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
            opacity: 0.6;
            display: none;
        }
        .results {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            padding: 20px;
            background: rgba(26,26,46,0.5);
            border-radius: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .card {
            width: 180px;
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 20px var(--shadow);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(255,77,77,0.3);
        }
        .card.selected {
            border: 3px solid var(--accent);
        }
        .card img {
            width: 100%;
            height: 270px;
            object-fit: cover;
        }
        .card-info {
            padding: 12px;
            text-align: center;
        }
        .card h3 {
            font-size: 1rem;
            margin: 8px 0 4px;
            height: 2.4em;
            overflow: hidden;
        }
        .card .meta {
            font-size: 0.85rem;
            color: #aaa;
        }
        .episode-selector {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .episode-selector select {
            padding: 12px 20px;
            border-radius: 50px;
            border: none;
            background: var(--card-bg);
            color: var(--text);
            font-size: 1rem;
            min-width: 180px;
            cursor: pointer;
        }
        #playBtn, #retryBtn, #openTab {
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            padding: 16px;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: block;
        }
        #playBtn {
            background: var(--accent);
            color: white;
        }
        #playBtn:disabled {
            background: #555;
            cursor: not-allowed;
        }
        #retryBtn {
            background: #444;
            color: white;
        }
        #openTab {
            background: #666;
            color: white;
        }
        .player-container {
            position: relative;
            padding-top: 56.25%;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            margin: 30px 0;
            box-shadow: 0 10px 40px var(--shadow);
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .loading {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.3rem;
            z-index: 10;
            pointer-events: none;
        }
        .status, .error {
            text-align: center;
            padding: 15px;
            border-radius: 15px;
            margin: 15px 0;
            font-weight: bold;
        }
        .status {
            background: rgba(0,255,0,0.1);
            color: #0f0;
        }
        .error {
            background: rgba(255,0,0,0.1);
            color: #f00;
        }
        #themeToggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--card-bg);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--shadow);
            transition: all 0.3s;
        }
        #themeToggle:hover {
            transform: scale(1.1);
        }
        #nowPlaying {
            text-align: center;
            color: var(--accent);
            margin: 20px 0;
            font-size: 1.8rem;
            text-shadow: 0 2px 10px rgba(255,77,77,0.4);
        }
    </style>
</head>
<body>
    <header>
        <div style="display: flex; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap;">
            <img src="Logo.jpg" alt="THMovies Logo" style="max-height: 120px; width: auto; border-radius: 12px; box-shadow: 0 4px 15px rgba(255,77,77,0.3); object-fit: contain;" >
            <h1 style="margin: 0; font-size: 2.8rem; color: var(--accent); text-shadow: 0 2px 10px rgba(255,77,77,0.4);"> THMovies </h1>
        </div>
    </header>
    <nav class="nav">
        <button data-type="movie" class="tab active">Film</button>
        <button data-type="tv" class="tab">Serie TV/Anime</button>
    </nav>
    <section id="movieSection" class="section active">
        <div class="search-container">
            <input type="text" id="movieSearch" placeholder="Cerca film...">
            <button class="clear-btn" id="clearMovie">×</button>
        </div>
        <div id="movieResults" class="results"></div>
    </section>
    <section id="tvSection" class="section">
        <div class="search-container">
            <input type="text" id="tvSearch" placeholder="Cerca serie TV...">
            <button class="clear-btn" id="clearTv">×</button>
        </div>
        <div id="tvResults" class="results"></div>
        <div id="tvEpisodeSelector" class="episode-selector hidden">
            <select id="seasonSelect"><option>Stagione...</option></select>
            <select id="episodeSelect"><option>Episodio...</option></select>
        </div>
    </section>
    <section id="animeSection" class="section">
        <div class="search-container">
            <input type="text" id="animeSearch" placeholder="Cerca anime...">
            <button class="clear-btn" id="clearAnime">×</button>
        </div>
        <div id="animeResults" class="results"></div>
        <div id="animeEpisodeSelector" class="episode-selector hidden">
            <select id="animeSeasonSelect"><option>Stagione...</option></select>
            <select id="animeEpSelect"><option>Episodio...</option></select>
            <select id="animeLangSelect">
                <option value="">Auto</option>
                <option value="?dub=1">English Dub</option>
                <option value="?sub=1">English Sub</option>
            </select>
        </div>
    </section>
    <button id="playBtn" disabled>▶ Riproduci</button>
    <button id="retryBtn" style="display:none;">Salta</button>
    <button id="openTab" style="display:none;">Nuova scheda</button>
    <div id="statusMsg" class="status"></div>
    <div id="errorMsg" class="error"></div>
    <h2 id="nowPlaying"></h2>
    <div class="player-container">
        <div id="loading" class="loading" style="display:none;">Caricamento...</div>
        <iframe id="player" allowfullscreen allow="autoplay; encrypted-media; fullscreen; picture-in-picture"> </iframe>
    </div>
    <button id="themeToggle">☀️</button>
    <script>
        // Check autenticazione
        if (localStorage.getItem('authenticated') !== 'true') {
            window.location.href = 'login.html';
        }

        // Token offuscato (Base64)
        const obfuscatedToken = 'ZXlKaGJHY2lPaUpJVXpJMU5pSXNJblI1Y0NJNklrcFhWQ0o5LmV5SmhZbU55WVc1a1ltOTBZU0JEYjI1MFpXNTBJblZ6WlhKeklpd2lhV0YwSWpveE5qVTBNekUwT0Rrd0xDSnBjM01pT2lKb2RIUndjem92TDJsemRISmxjM1J2YTJWdUwyeDFjM1JsYlc4dFlXNHdMbUoxYzJsdmJqMGlmUS5ieVVvcVpmaWxoblh4RzZ1NDF6eFZJcG5ROFozSjRVcVN6dUdtRFFIYVBh';
        const TMDB_TOKEN = atob(obfuscatedToken);
        const tmdbHeaders = { Authorization: `Bearer ${TMDB_TOKEN}`, 'Content-Type': 'application/json;charset=utf-8' };
        const PROVIDERS = {
            movie: id => `https://multiembed.mov/?video_id=${id}&tmdb=1`,
            tv: (id, s, e) => `https://multiembed.mov/?video_id=${id}&tmdb=1&s=${s}&e=${e}`,
            anime: (id, s, e, lang='') => `https://multiembed.mov/?video_id=${id}&tmdb=1&s=${s}&e=${e}${lang}`
        };
        let currentType = 'movie';
        let selected = { id: null, season: 1, episode: 1, lang: '', episodeName: '' };
        let currentTitle = '';
        let currentEpisodes = [];
        let isLoading = false;
        const els = {
            tabs: document.querySelectorAll('.nav button'),
            sections: document.querySelectorAll('.section'),
            search: {
                movie: document.getElementById('movieSearch'),
                tv: document.getElementById('tvSearch'),
                anime: document.getElementById('animeSearch')
            },
            clear: {
                movie: document.getElementById('clearMovie'),
                tv: document.getElementById('clearTv'),
                anime: document.getElementById('clearAnime')
            },
            results: {
                movie: document.getElementById('movieResults'),
                tv: document.getElementById('tvResults'),
                anime: document.getElementById('animeResults')
            },
            episodeSelectors: {
                tv: document.getElementById('tvEpisodeSelector'),
                anime: document.getElementById('animeEpisodeSelector')
            },
            season: {
                tv: document.getElementById('seasonSelect'),
                anime: document.getElementById('animeSeasonSelect')
            },
            episode: {
                tv: document.getElementById('episodeSelect'),
                anime: document.getElementById('animeEpSelect')
            },
            lang: document.getElementById('animeLangSelect'),
            playBtn: document.getElementById('playBtn'),
            retryBtn: document.getElementById('retryBtn'),
            openTab: document.getElementById('openTab'),
            player: document.getElementById('player'),
            loading: document.getElementById('loading'),
            status: document.getElementById('statusMsg'),
            error: document.getElementById('errorMsg'),
            themeToggle: document.getElementById('themeToggle'),
            nowPlaying: document.getElementById('nowPlaying')
        };
        function showError(msg) {
            els.error.textContent = msg;
            els.status.textContent = '';
        }
        function showStatus(msg) {
            els.status.textContent = msg;
            els.error.textContent = '';
        }
        function showLoading(show) {
            els.loading.style.display = show ? 'flex' : 'none';
        }
        function clearPlayer() {
            els.player.src = '';
            els.playBtn.disabled = true;
            els.retryBtn.style.display = 'none';
            els.openTab.style.display = 'none';
            showLoading(false);
            els.nowPlaying.textContent = '';
        }
        function createCard(poster, title, date, onClick) {
            const card = document.createElement('div');
            card.className = 'card';
            const img = document.createElement('img');
            img.src = poster ? `https://image.tmdb.org/t/p/w200${poster}` : 'https://via.placeholder.com/180x270?text=N/A';
            const info = document.createElement('div');
            info.className = 'card-info';
            const h3 = document.createElement('h3');
            h3.textContent = title;
            const p = document.createElement('p');
            p.textContent = date?.slice(0,4) || 'N/D';
            info.append(h3, p);
            card.append(img, info);
            card.onclick = onClick;
            return card;
        }
        async function tmdbFetch(url) {
            try {
                const res = await fetch(url, { headers: tmdbHeaders });
                if (!res.ok) throw new Error(res.status);
                return await res.json();
            } catch (e) {
                console.error(e);
                return null;
            }
        }
        async function searchMedia(type, query) {
            if (!query.trim()) return;
            const resultsEl = els.results[type];
            resultsEl.innerHTML = '<p style="text-align:center;color:#aaa;">Caricamento...</p>';
            const endpoint = type === 'movie' ? 'movie' : 'tv';
            const extra = type === 'anime' ? '&with_genres=16&with_keywords=210024' : '';
            const data = await tmdbFetch(`https://api.themoviedb.org/3/search/${endpoint}?query=${encodeURIComponent(query)}&language=it-IT${extra}`);
            resultsEl.innerHTML = '';
            if (!data?.results?.length) {
                resultsEl.innerHTML = '<p style="text-align:center;color:#aaa;">Nessun risultato</p>';
                return;
            }
            data.results.slice(0,8).forEach(item => {
                const card = createCard(item.poster_path, item.title || item.name, item.release_date || item.first_air_date, () => selectMedia(type, item.id, item.title || item.name));
                resultsEl.appendChild(card);
            });
        }
        async function selectMedia(type, id, titleFromSearch) {
            selected = { id, season: 1, episode: 1, lang: '', episodeName: '' };
            currentTitle = '';
            currentEpisodes = [];
            clearPlayer();
            showStatus('Titolo selezionato');
            document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
            event.target.closest('.card')?.classList.add('selected');
            let data;
            if (type === 'movie') {
                data = await tmdbFetch(`https://api.themoviedb.org/3/movie/${id}?language=it-IT`);
                currentTitle = data?.title || titleFromSearch || 'Film Sconosciuto';
                els.playBtn.disabled = false;
            } else {
                data = await tmdbFetch(`https://api.themoviedb.org/3/tv/${id}?language=it-IT`);
                currentTitle = data?.name || titleFromSearch || 'Serie Sconosciuta';
                const box = type === 'tv' ? els.episodeSelectors.tv : els.episodeSelectors.anime;
                const seasonSelect = type === 'tv' ? els.season.tv : els.season.anime;
                box.classList.remove('hidden');
                seasonSelect.innerHTML = '';
                data.seasons?.forEach(s => {
                    if (s.season_number > 0) {
                        const opt = document.createElement('option');
                        opt.value = s.season_number;
                        opt.text = `Stagione ${s.season_number}`;
                        seasonSelect.appendChild(opt);
                    }
                });
                await updateEpisodes(type);
                els.playBtn.disabled = false;
            }
        }
        async function updateEpisodes(type) {
            const id = selected.id;
            const season = type === 'tv' ? els.season.tv.value : els.season.anime.value;
            if (!season) return;
            const data = await tmdbFetch(`https://api.themoviedb.org/3/tv/${id}/season/${season}?language=it-IT`);
            if (!data?.episodes) return;
            currentEpisodes = data.episodes;
            const epSelect = type === 'tv' ? els.episode.tv : els.episode.anime;
            epSelect.innerHTML = '';
            data.episodes.forEach(ep => {
                const opt = document.createElement('option');
                opt.value = ep.episode_number;
                opt.text = `Ep ${ep.episode_number}: ${ep.name || 'Senza Titolo'}`;
                epSelect.appendChild(opt);
            });
            selected.season = +season;
            selected.episode = +epSelect.value;
            selected.episodeName = currentEpisodes.find(ep => ep.episode_number === selected.episode)?.name || 'Senza Titolo';
        }
        function loadPlayer() {
            if (!selected.id) return showError('Seleziona un titolo!');
            if (currentType !== 'movie' && (!selected.season || !selected.episode)) return showError('Seleziona stagione/episodio!');
            showLoading(true);
            showStatus('Caricamento player...');
            const url = currentType === 'movie' ? PROVIDERS.movie(selected.id) : currentType === 'tv' ? PROVIDERS.tv(selected.id, selected.season, selected.episode) : PROVIDERS.anime(selected.id, selected.season, selected.episode, selected.lang);
            els.player.src = url;
            els.retryBtn.style.display = 'block';
            els.openTab.style.display = 'block';
            els.openTab.onclick = () => window.open(url, '_blank');
            const nowPlayingText = currentType === 'movie' ? currentTitle : `${currentTitle} - Stagione ${selected.season} Episodio ${selected.episode}: ${selected.episodeName}`;
            els.nowPlaying.textContent = `Now Playing: ${nowPlayingText}`;
            const timeout = setTimeout(() => {
                showLoading(false);
                showError('Caricamento lento, prova a saltare');
            }, 45000);
            els.player.onload = () => {
                clearTimeout(timeout);
                showLoading(false);
                showStatus('Pronto!');
            };
            els.player.onerror = () => {
                clearTimeout(timeout);
                showLoading(false);
                showError('Errore caricamento');
            };
        }
        // EVENTI
        els.tabs.forEach(btn => {
            btn.onclick = () => {
                els.tabs.forEach(b => b.classList.remove('active'));
                els.sections.forEach(s => s.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.type + 'Section').classList.add('active');
                currentType = btn.dataset.type;
                clearPlayer();
                showError('');
                showStatus('');
                selected = { id: null, season: 1, episode: 1, lang: '', episodeName: '' };
                currentTitle = '';
                currentEpisodes = [];
            };
        });
        ['movie','tv','anime'].forEach(type => {
            const input = els.search[type];
            const clear = els.clear[type];
            input.oninput = () => {
                clear.style.display = input.value.trim() ? 'block' : 'none';
                clearTimeout(window[`timeout${type}`]);
                window[`timeout${type}`] = setTimeout(() => searchMedia(type, input.value.trim()), 400);
            };
            clear.onclick = () => {
                input.value = '';
                clear.style.display = 'none';
                els.results[type].innerHTML = '';
            };
        });
        els.season.tv.onchange = () => updateEpisodes('tv');
        els.season.anime.onchange = () => updateEpisodes('anime');
        els.episode.tv.onchange = () => {
            selected.episode = +els.episode.tv.value;
            selected.episodeName = currentEpisodes.find(ep => ep.episode_number === selected.episode)?.name || 'Senza Titolo';
        };
        els.episode.anime.onchange = () => {
            selected.episode = +els.episode.anime.value;
            selected.episodeName = currentEpisodes.find(ep => ep.episode_number === selected.episode)?.name || 'Senza Titolo';
        };
        els.lang.onchange = () => selected.lang = els.lang.value;
        els.playBtn.onclick = loadPlayer;
        els.retryBtn.onclick = loadPlayer;
        els.themeToggle.onclick = () => {
            document.body.classList.toggle('light');
            els.themeToggle.textContent = document.body.classList.contains('light') ? '🌙' : '☀️';
        };
        // AVVIO
        window.onload = () => {
            els.themeToggle.textContent = '☀️';
        };
    </script>
</body>
</html>
