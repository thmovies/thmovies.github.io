<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THMovies</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            --card-bg: #1a1a2e;
            --text: #e0e0ff;
            --accent: #ff4d4d;
            --shadow: rgba(0,0,0,0.6);
            --transition: all 0.3s ease;
        }
        body.light {
            --bg: linear-gradient(135deg, #f0f4ff 0%, #d0d8ff 100%);
            --card-bg: #ffffff;
            --text: #101020;
            --accent: #ff4d4d;
            --shadow: rgba(0,0,0,0.2);
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, sans-serif;
            margin: 0;
            min-height: 100vh;
            transition: var(--transition);
        }
        header {
            text-align: center;
            padding: 30px 20px;
            background: rgba(26,26,46,0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px var(--shadow);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        header h1 {
            color: var(--accent);
            font-size: 3rem;
            margin: 0;
            text-shadow: 0 2px 10px rgba(255,77,77,0.4);
            animation: glow 3s infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 0 0 5px rgba(255,77,77,0.4); }
            to { text-shadow: 0 0 15px rgba(255,77,77,0.8); }
        }
        .nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .nav button {
            background: var(--card-bg);
            border: none;
            padding: 12px 28px;
            color: var(--text);
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px var(--shadow);
        }
        .nav button.active {
            background: var(--accent);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(255,77,77,0.5);
        }
        .nav button:hover {
            transform: scale(1.1);
        }
        .section {
            display: none;
            padding: 0 20px;
            max-width: 1200px;
            margin: 0 auto;
            animation: fadeIn 0.5s ease-in-out;
        }
        .section.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .search-container {
            position: relative;
            margin: 20px 0;
        }
        input[type="text"] {
            width: 100%;
            padding: 15px 50px 15px 20px;
            border: none;
            border-radius: 50px;
            background: var(--card-bg);
            color: var(--text);
            font-size: 1.1rem;
            box-shadow: 0 4px 15px var(--shadow);
            transition: var(--transition);
        }
        input[type="text"]:focus {
            outline: none;
            box-shadow: 0 0 10px var(--accent);
        }
        .clear-btn {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
            opacity: 0.6;
            display: none;
            transition: var(--transition);
        }
        .clear-btn:hover {
            opacity: 1;
            transform: translateY(-50%) rotate(90deg);
        }
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            padding: 20px;
            background: rgba(26,26,46,0.5);
            border-radius: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 20px var(--shadow);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            opacity: 0;
            transform: translateY(20px);
            animation: cardFadeIn 0.5s ease-out forwards;
        }
        @keyframes cardFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        /* Add more as needed */
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(255,77,77,0.3);
        }
        .card.selected {
            border: 3px solid var(--accent);
        }
        .card img {
            width: 100%;
            height: 270px;
            object-fit: cover;
            transition: var(--transition);
        }
        .card:hover img {
            transform: scale(1.05);
        }
        .card-info {
            padding: 12px;
            text-align: center;
        }
        .card h3 {
            font-size: 1rem;
            margin: 8px 0 4px;
            height: 2.4em;
            overflow: hidden;
        }
        .card .meta {
            font-size: 0.85rem;
            color: #aaa;
        }
        .fav-btn {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .episode-selector {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .episode-selector select {
            padding: 12px 20px;
            border-radius: 50px;
            border: none;
            background: var(--card-bg);
            color: var(--text);
            font-size: 1rem;
            min-width: 220px;
            cursor: pointer;
            transition: var(--transition);
        }
        .episode-selector select:focus {
            outline: none;
            box-shadow: 0 0 10px var(--accent);
        }
        /* OVERLAY REGOLE BLOCCANTE */
        .rules-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }
        .rules-overlay.active {
            display: flex;
        }
        .rules-box {
            background: linear-gradient(135deg, #1a0026 0%, #0b0015 100%);
            color: #ffd700;
            width: 90%;
            max-width: 620px;
            padding: 45px 35px;
            border-radius: 20px;
            border: 4px solid #ff4500;
            box-shadow: 0 0 80px rgba(255, 69, 0, 0.7), inset 0 0 30px rgba(255, 140, 0, 0.3);
            text-align: center;
            position: relative;
            animation: popup 0.6s ease-out;
        }
        @keyframes popup {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .rules-box h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.2rem;
            margin: 0 0 35px;
            background: linear-gradient(90deg, #ffd700, #ff8c00, #ff4500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px #ff4500;
        }
        .rules-box ul {
            list-style: none;
            padding: 0;
            margin: 0 0 40px;
            font-size: 1.25rem;
            line-height: 2;
            text-align: left;
        }
        .rules-box li {
            margin: 18px 0;
            padding-left: 45px;
            position: relative;
            transition: var(--transition);
        }
        .rules-box li:hover {
            transform: translateX(5px);
        }
        .rules-box li::before {
            content: "⛔";
            position: absolute;
            left: 0;
            top: 2px;
            font-size: 1.6rem;
        }
        .close-rules-btn {
            background: linear-gradient(90deg, #ff4500, #ff8c00);
            color: white;
            border: none;
            padding: 18px 80px;
            border-radius: 50px;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 69, 0, 0.6);
            transition: var(--transition);
        }
        .close-rules-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 35px rgba(255, 69, 0, 0.9);
        }
        #playBtn, #retryBtn, #openTab, #trailerBtn {
            width: 100%;
            max-width: 400px;
            margin: 10px auto;
            padding: 16px;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
            display: block;
        }
        #playBtn {
            background: var(--accent);
            color: white;
        }
        #playBtn:disabled {
            background: #555;
            cursor: not-allowed;
        }
        #retryBtn {
            background: #444;
            color: white;
        }
        #openTab {
            background: #666;
            color: white;
        }
        #trailerBtn {
            background: linear-gradient(90deg, #ff8c00, #ffd700);
            color: #1a1a2e;
            display: none;
        }
        #trailerBtn:disabled {
            background: #888;
            cursor: not-allowed;
        }
        .player-container {
            position: relative;
            padding-top: 56.25%;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            margin: 30px 0;
            box-shadow: 0 10px 40px var(--shadow);
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .loading {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.3rem;
            z-index: 10;
            pointer-events: none;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status, .error {
            text-align: center;
            padding: 15px;
            border-radius: 15px;
            margin: 15px 0;
            font-weight: bold;
        }
        .status {
            background: rgba(0,255,0,0.1);
            color: #0f0;
        }
        .error {
            background: rgba(255,0,0,0.1);
            color: #f00;
        }
        #themeToggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--card-bg);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--shadow);
            transition: var(--transition);
        }
        #themeToggle:hover {
            transform: scale(1.1) rotate(15deg);
        }
        /* Trailer Modal */
        #trailerModal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        #trailerModal.active {
            display: flex;
        }
        .trailer-content {
            position: relative;
            width: 80%;
            max-width: 800px;
            padding: 0;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
        }
        .trailer-content::before {
            content: '';
            display: block;
            padding-top: 56.25%; /* 16:9 aspect ratio */
        }
        .trailer-content iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .close-trailer {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            z-index: 1;
        }
        /* New additions: Favorites */
        .favorites {
            margin: 20px 0;
            padding: 20px;
            background: rgba(26,26,46,0.5);
            border-radius: 20px;
        }
        .favorites h2 {
            text-align: center;
        }
        /* Accessibility */
        button, input, select {
            outline-offset: 2px;
        }
        .card[aria-selected="true"] {
            border: 3px solid var(--accent);
        }
    </style>
</head>
<body>
    <header>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <img src="logo.png" alt="THMovies Logo" style="max-height: 120px; width: auto;" >
            <div id="logoutContainer" style="display:none;">
                <button onclick="logout()" style="background: linear-gradient(90deg, #ff4500, #ff8c00); color: white; border: none; padding: 12px 40px; border-radius: 50px; font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 6px 20px rgba(255,69,0,0.5); transition: var(--transition);" aria-label="Logout">LOGOUT</button>
            </div>
        </div>
    </header>
    <nav class="nav">
        <button data-type="movie" class="tab active">Film</button>
        <button data-type="tv" class="tab">Serie TV</button>
        <button data-type="anime" class="tab">Anime</button>
    </nav>
    <section id="movieSection" class="section active">
        <div class="search-container">
            <input type="text" id="movieSearch" placeholder="Cerca film..." aria-label="Cerca film">
            <button class="clear-btn" id="clearMovie">×</button>
        </div>
        <div id="movieResults" class="results"></div>
        <div id="movieLangSelector" class="episode-selector hidden">
            <select id="movieLangSelect" aria-label="Seleziona lingua">
                <option value="">Auto</option>
                <option value="?lang=en">English</option>
                <option value="?lang=it">Italian</option>
            </select>
        </div>
    </section>
    <section id="tvSection" class="section">
        <div class="search-container">
            <input type="text" id="tvSearch" placeholder="Cerca serie TV..." aria-label="Cerca serie TV">
            <button class="clear-btn" id="clearTv">×</button>
        </div>
        <div id="tvResults" class="results"></div>
        <div id="tvEpisodeSelector" class="episode-selector hidden">
            <select id="seasonSelect" aria-label="Seleziona stagione">
                <option>Stagione...</option>
            </select>
            <select id="episodeSelect" aria-label="Seleziona episodio">
                <option>Episodio...</option>
            </select>
            <select id="tvLangSelect" aria-label="Seleziona lingua">
                <option value="">Auto</option>
                <option value="?lang=en">English</option>
                <option value="?lang=it">Italian</option>
            </select>
        </div>
    </section>
    <section id="animeSection" class="section">
        <div class="search-container">
            <input type="text" id="animeSearch" placeholder="Cerca anime..." aria-label="Cerca anime">
            <button class="clear-btn" id="clearAnime">×</button>
        </div>
        <div id="animeResults" class="results"></div>
        <div id="animeEpisodeSelector" class="episode-selector hidden">
            <select id="animeSeasonSelect" aria-label="Seleziona stagione">
                <option>Stagione...</option>
            </select>
            <select id="animeEpSelect" aria-label="Seleziona episodio">
                <option>Episodio...</option>
            </select>
            <select id="animeLangSelect" aria-label="Seleziona lingua">
                <option value="">Auto</option>
                <option value="?dub=1">English Dub</option>
                <option value="?sub=1">English Sub</option>
                <option value="?lang=ja">Japanese</option>
            </select>
        </div>
    </section>
    <!-- New: Favorites section -->
    <section id="favoritesSection" class="favorites">
        <h2>I tuoi preferiti</h2>
        <div id="favoritesList" class="results"></div>
    </section>
    <button id="playBtn" disabled aria-label="Riproduci">▶ Riproduci</button>
    <button id="trailerBtn" disabled aria-label="Guarda Trailer">📹 Guarda Trailer</button>
    <button id="retryBtn" style="display:none;" aria-label="Riprova">Riprova</button>
    <button id="openTab" style="display:none;" aria-label="Apri in nuova scheda">Nuova scheda</button>
    <div id="statusMsg" class="status" role="status"></div>
    <div id="errorMsg" class="error" role="alert"></div>
    <div class="player-container">
        <div id="loading" class="loading" style="display:none;"><i class="fas fa-spinner"></i> Caricamento...</div>
        <iframe id="player" allowfullscreen allow="autoplay; encrypted-media; fullscreen; picture-in-picture"></iframe>
    </div>
    <!-- Trailer Modal -->
    <div id="trailerModal">
        <div class="trailer-content">
            <button class="close-trailer" onclick="closeTrailer()" aria-label="Chiudi trailer">×</button>
            <iframe id="trailerPlayer" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"></iframe>
        </div>
    </div>
    <!-- OVERLAY REGOLE BLOCCANTE -->
    <div id="rulesOverlay" class="rules-overlay">
        <div class="rules-box">
            <h2>REGOLE DI THMOVIES</h2>
            <ul>
                <li>Regola 1: non parlare di THMovies.</li>
                <li>Regola 2: NON parlare di THMovies.</li>
                <li>Regola 3: Scarica e usa l'ad blocker</li>
            </ul>
            <button class="close-rules-btn" onclick="closeRulesOverlay()" aria-label="Chiudi regole">HO CAPITO – CHIUDI</button>
        </div>
    </div>
    <button id="themeToggle" aria-label="Cambia tema">☀️</button>
    <script>
        // Constants
        const TMDB_TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiI0ZTExOGZjMThjNDdiZGU3ODc1ZDY0MGRlMGE4ZWQzMiIsIm5iZiI6MTc2ODkxMDYwOC4xNTM5OTk4LCJzdWIiOiI2OTZmNmYxMDViN2EyMjEzMTlmZTEwZTMiLCJzY29wZXMiOlsiYXBpX3JlYWQiXSwidmVyc2lvbiI6MX0.byUoqZfilhnXxG6u41zxVIpnQ8Z3J4UqSzuGmDQHaPA';
        const tmdbHeaders = { Authorization: `Bearer ${TMDB_TOKEN}`, 'Content-Type': 'application/json;charset=utf-8' };
        const PROVIDERS = {
            movie: [
                (id, lang) => `https://vidsrc.to/embed/movie/${id}${lang}`,
                (id, lang) => `https://vidsrc.pro/embed/${id}${lang}`,
                (id, lang) => `https://autoembed.cc/movie/${id}${lang ? `&${lang.slice(1)}` : ''}`,
                (id, lang) => `https://vidsrc.in/embed/movie?tmdb=${id}${lang}`,
                (id, lang) => `https://multiembed.mov/?video_id=${id}&tmdb=1${lang}`
            ],
            tv: [
                (id, s, e, lang) => `https://vidsrc.to/embed/tv/${id}/${s}/${e}${lang}`,
                (id, s, e, lang) => `https://vidsrc.pro/embed/${id}/${s}/${e}${lang}`,
                (id, s, e, lang) => `https://autoembed.cc/tv/${id}/${s}/${e}${lang ? `&${lang.slice(1)}` : ''}`,
                (id, s, e, lang) => `https://vidsrc.in/embed/tv?tmdb=${id}&season=${s}&episode=${e}${lang}`,
                (id, s, e, lang) => `https://multiembed.mov/?video_id=${id}&tmdb=1&s=${s}&e=${e}${lang}`
            ],
            anime: [
                (id, s, e, lang) => `https://vidsrc.to/embed/tv/${id}/${s}/${e}${lang}`,
                (id, s, e, lang) => `https://vidsrc.pro/embed/${id}/${s}/${e}${lang}`,
                (id, s, e, lang) => `https://autoembed.cc/tv/${id}/${s}/${e}${lang ? `&${lang.slice(1)}` : ''}`,
                (id, s, e, lang) => `https://vidsrc.in/embed/tv?tmdb=${id}&season=${s}&episode=${e}${lang}`,
                (id, s, e, lang) => `https://multiembed.mov/?video_id=${id}&tmdb=1&s=${s}&e=${e}${lang}`
            ]
        };

        // State
        let currentType = 'movie';
        let selected = { id: null, season: 1, episode: 1, lang: '', trailerKey: null };
        let currentProviderIndex = 0;

        // Elements
        const els = {
            tabs: document.querySelectorAll('.nav button'),
            sections: document.querySelectorAll('.section'),
            search: {
                movie: document.getElementById('movieSearch'),
                tv: document.getElementById('tvSearch'),
                anime: document.getElementById('animeSearch')
            },
            clear: {
                movie: document.getElementById('clearMovie'),
                tv: document.getElementById('clearTv'),
                anime: document.getElementById('clearAnime')
            },
            results: {
                movie: document.getElementById('movieResults'),
                tv: document.getElementById('tvResults'),
                anime: document.getElementById('animeResults')
            },
            episodeSelectors: {
                movie: document.getElementById('movieLangSelector'),
                tv: document.getElementById('tvEpisodeSelector'),
                anime: document.getElementById('animeEpisodeSelector')
            },
            season: {
                tv: document.getElementById('seasonSelect'),
                anime: document.getElementById('animeSeasonSelect')
            },
            episode: {
                tv: document.getElementById('episodeSelect'),
                anime: document.getElementById('animeEpSelect')
            },
            lang: {
                movie: document.getElementById('movieLangSelect'),
                tv: document.getElementById('tvLangSelect'),
                anime: document.getElementById('animeLangSelect')
            },
            playBtn: document.getElementById('playBtn'),
            trailerBtn: document.getElementById('trailerBtn'),
            retryBtn: document.getElementById('retryBtn'),
            openTab: document.getElementById('openTab'),
            player: document.getElementById('player'),
            loading: document.getElementById('loading'),
            status: document.getElementById('statusMsg'),
            error: document.getElementById('errorMsg'),
            themeToggle: document.getElementById('themeToggle'),
            favoritesList: document.getElementById('favoritesList'),
            trailerModal: document.getElementById('trailerModal'),
            trailerPlayer: document.getElementById('trailerPlayer')
        };

        // Authentication check
        if (localStorage.getItem("authenticated") !== "true") {
            alert("Devi fare login prima di accedere!");
            location.href = "index.html";
        }

        // Utility functions
        function showError(msg) {
            els.error.textContent = msg;
            els.status.textContent = '';
        }

        function showStatus(msg) {
            els.status.textContent = msg;
            els.error.textContent = '';
        }

        function showLoading(show) {
            els.loading.style.display = show ? 'flex' : 'none';
        }

        function clearPlayer() {
            els.player.src = '';
            els.playBtn.disabled = true;
            els.trailerBtn.style.display = 'none';
            els.retryBtn.style.display = 'none';
            els.openTab.style.display = 'none';
            showLoading(false);
        }

        async function tmdbFetch(url) {
            try {
                const res = await fetch(url, { headers: tmdbHeaders });
                if (!res.ok) throw new Error(res.status);
                return await res.json();
            } catch (e) {
                console.error(e);
                return null;
            }
        }

        function createCard(poster, title, date, onClick, id, type, isFavorite = false) {
            const card = document.createElement('div');
            card.className = 'card';
            card.setAttribute('aria-selected', 'false');
            const img = document.createElement('img');
            img.src = poster ? `https://image.tmdb.org/t/p/w200${poster}` : 'https://via.placeholder.com/180x270?text=N/A';
            img.alt = title;
            const info = document.createElement('div');
            info.className = 'card-info';
            const h3 = document.createElement('h3');
            h3.textContent = title;
            const p = document.createElement('p');
            p.className = 'meta';
            p.textContent = date?.slice(0,4) || 'N/D';
            const favBtn = document.createElement('button');
            favBtn.className = 'fav-btn';
            favBtn.innerHTML = isFavorite ? '<i class="fas fa-heart"></i>' : '<i class="far fa-heart"></i>';
            favBtn.onclick = (e) => {
                e.stopPropagation();
                toggleFavorite(id, type, title, poster, date);
            };
            info.append(h3, p, favBtn);
            card.append(img, info);
            card.onclick = onClick;
            return card;
        }

        async function searchMedia(type, query) {
            if (!query.trim()) return;
            const resultsEl = els.results[type];
            resultsEl.innerHTML = '<p style="text-align:center;color:#aaa;">Caricamento...</p>';
            const endpoint = type === 'movie' ? 'movie' : 'tv';
            let extra = '';
            if (type === 'anime') extra = '&with_genres=16&with_keywords=210024';
            const data = await tmdbFetch(`https://api.themoviedb.org/3/search/${endpoint}?query=${encodeURIComponent(query)}&language=it-IT${extra}`);
            resultsEl.innerHTML = '';
            if (!data?.results?.length) {
                resultsEl.innerHTML = '<p style="text-align:center;color:#aaa;">Nessun risultato</p>';
                return;
            }
            data.results.slice(0,8).forEach((item, index) => {
                const isFav = isFavorite(item.id, type);
                const card = createCard(item.poster_path, item.title || item.name, item.release_date || item.first_air_date, () => selectMedia(type, item.id), item.id, type, isFav);
                card.style.animationDelay = `${index * 0.1}s`;
                resultsEl.appendChild(card);
            });
        }

        async function selectMedia(type, id) {
            selected = { id, season: 1, episode: 1, lang: '', trailerKey: null };
            clearPlayer();
            showStatus('Titolo selezionato');
            document.querySelectorAll('.card').forEach(c => c.setAttribute('aria-selected', 'false'));
            event.target.closest('.card')?.setAttribute('aria-selected', 'true');
            const endpoint = type === 'movie' ? 'movie' : 'tv';
            const details = await tmdbFetch(`https://api.themoviedb.org/3/${endpoint}/${id}?language=it-IT`);
            const videos = await tmdbFetch(`https://api.themoviedb.org/3/${endpoint}/${id}/videos?language=en-US`);
            if (videos?.results) {
                const trailer = videos.results.find(v => v.type === 'Trailer' && v.site === 'YouTube');
                if (trailer) {
                    selected.trailerKey = trailer.key;
                    els.trailerBtn.style.display = 'block';
                    els.trailerBtn.disabled = false;
                }
            }
            const box = els.episodeSelectors[type];
            box.classList.remove('hidden');
            if (type === 'movie') {
                els.playBtn.disabled = false;
            } else {
                if (!details) return;
                const seasonSelect = els.season[type];
                seasonSelect.innerHTML = '';
                details.seasons?.forEach(s => {
                    if (s.season_number > 0) {
                        const opt = document.createElement('option');
                        opt.value = s.season_number;
                        opt.text = `Stagione ${s.season_number}`;
                        seasonSelect.appendChild(opt);
                    }
                });
                await updateEpisodes(type);
                els.playBtn.disabled = false;
            }
        }

        async function updateEpisodes(type) {
            const id = selected.id;
            const season = els.season[type].value;
            if (!season) return;
            const data = await tmdbFetch(`https://api.themoviedb.org/3/tv/${id}/season/${season}?language=it-IT`);
            if (!data?.episodes) return;
            const epSelect = els.episode[type];
            epSelect.innerHTML = '';
            data.episodes.forEach(ep => {
                const opt = document.createElement('option');
                opt.value = ep.episode_number;
                opt.text = `Ep ${ep.episode_number}: ${ep.name || 'Episodio senza titolo'}`;
                epSelect.appendChild(opt);
            });
            selected.season = +season;
            selected.episode = 1;
            epSelect.value = 1;
        }

        async function loadPlayer(startIndex = 0) {
            if (!selected.id) return showError('Seleziona un titolo!');
            if (currentType !== 'movie' && (!selected.season || !selected.episode)) return showError('Seleziona stagione/episodio!');
            showLoading(true);
            const providerList = PROVIDERS[currentType];
            let success = false;
            currentProviderIndex = startIndex;
            for (let i = currentProviderIndex; i < providerList.length; i++) {
                currentProviderIndex = i;
                const url = currentType === 'movie' ? providerList[i](selected.id, selected.lang) : providerList[i](selected.id, selected.season, selected.episode, selected.lang);
                const providerName = url.split('/')[2].replace('www.', '');
                showStatus(`Provando ${providerName} (${i+1}/${providerList.length})...`);
                els.player.src = url;
                els.openTab.onclick = () => window.open(url, '_blank');
                try {
                    await new Promise((resolve, reject) => {
                        const timeout = setTimeout(() => reject('timeout'), 12000);
                        els.player.onload = () => {
                            setTimeout(() => { resolve('loaded'); }, 3000);
                        };
                        els.player.onerror = () => {
                            clearTimeout(timeout);
                            reject('iframe error');
                        };
                    });
                    success = true;
                    showStatus(`Caricato con ${providerName}! Se non parte → clicca Riprova per saltare.`);
                    break;
                } catch (err) {
                    showError(`${providerName} fallito (${err}). Passo al successivo...`);
                }
            }
            showLoading(false);
            els.retryBtn.style.display = 'block';
            els.openTab.style.display = 'block';
            if (!success) {
                showError('Tutti i provider falliti o senza fonti. Prova un titolo più popolare o riprova dopo.');
                currentProviderIndex = 0;
            }
        }

        function showTrailer() {
            if (!selected.trailerKey) return;
            els.trailerPlayer.src = `https://www.youtube.com/embed/${selected.trailerKey}?autoplay=1&rel=0&modestbranding=1&controls=1`;
            els.trailerModal.classList.add('active');
        }

        function closeTrailer() {
            els.trailerModal.classList.remove('active');
            els.trailerPlayer.src = '';
        }

        function logout() {
            localStorage.removeItem("authenticated");
            localStorage.removeItem("showRulesOnLoad");
            window.location.href = "index.html";
        }

        function closeRulesOverlay() {
            document.getElementById("rulesOverlay").classList.remove("active");
            localStorage.removeItem("showRulesOnLoad");
        }

        // Favorites
        function getFavorites() {
            return JSON.parse(localStorage.getItem('favorites')) || [];
        }

        function saveFavorites(favs) {
            localStorage.setItem('favorites', JSON.stringify(favs));
        }

        function isFavorite(id, type) {
            const favs = getFavorites();
            return favs.some(f => f.id === id && f.type === type);
        }

        function toggleFavorite(id, type, title, poster, date) {
            let favs = getFavorites();
            const index = favs.findIndex(f => f.id === id && f.type === type);
            if (index > -1) {
                favs.splice(index, 1);
            } else {
                favs.push({ id, type, title, poster, date });
            }
            saveFavorites(favs);
            loadFavorites();
            // Refresh current search if needed
            const searchInput = els.search[type];
            if (searchInput && searchInput.value) searchMedia(type, searchInput.value);
        }

        function loadFavorites() {
            const favs = getFavorites();
            els.favoritesList.innerHTML = '';
            if (!favs.length) {
                els.favoritesList.innerHTML = '<p style="text-align:center;color:#aaa;">Nessun preferito</p>';
                return;
            }
            favs.forEach((f, index) => {
                const card = createCard(f.poster, f.title, f.date, () => selectMedia(f.type, f.id), f.id, f.type, true);
                card.style.animationDelay = `${index * 0.1}s`;
                els.favoritesList.appendChild(card);
            });
        }

        // Event listeners
        els.tabs.forEach(btn => {
            btn.onclick = () => {
                els.tabs.forEach(b => b.classList.remove('active'));
                els.sections.forEach(s => s.classList.remove('active'));
                btn.classList.add('active');
                const type = btn.dataset.type;
                document.getElementById(type + 'Section').classList.add('active');
                currentType = type;
                clearPlayer();
                showError('');
                showStatus('');
                selected = { id: null, season: 1, episode: 1, lang: '', trailerKey: null };
                Object.keys(els.episodeSelectors).forEach(key => els.episodeSelectors[key].classList.add('hidden'));
            };
        });

        ['movie','tv','anime'].forEach(type => {
            const input = els.search[type];
            const clear = els.clear[type];
            input.oninput = () => {
                clear.style.display = input.value.trim() ? 'block' : 'none';
                clearTimeout(window[`timeout${type}`]);
                window[`timeout${type}`] = setTimeout(() => searchMedia(type, input.value.trim()), 400);
            };
            clear.onclick = () => {
                input.value = '';
                clear.style.display = 'none';
                els.results[type].innerHTML = '';
            };
        });

        els.season.tv.onchange = () => updateEpisodes('tv');
        els.season.anime.onchange = () => updateEpisodes('anime');
        els.episode.tv.onchange = () => selected.episode = +els.episode.tv.value;
        els.episode.anime.onchange = () => selected.episode = +els.episode.anime.value;

        Object.keys(els.lang).forEach(type => {
            if (els.lang[type]) {
                els.lang[type].onchange = () => {
                    selected.lang = els.lang[type].value;
                    if (els.player.src) {
                        loadPlayer(currentProviderIndex); // Reload with new language
                    }
                };
            }
        });

        els.playBtn.onclick = () => {
            currentProviderIndex = 0;
            loadPlayer(0);
        };

        els.trailerBtn.onclick = showTrailer;

        els.retryBtn.onclick = () => {
            const nextIndex = (currentProviderIndex + 1) % PROVIDERS[currentType].length;
            if (nextIndex === 0) {
                showStatus('Ritorno al primo provider (ciclo completato)');
            }
            loadPlayer(nextIndex);
        };

        els.themeToggle.onclick = () => {
            document.body.classList.toggle('light');
            const isLight = document.body.classList.contains('light');
            els.themeToggle.textContent = isLight ? '🌙' : '☀️';
            localStorage.setItem("theme", isLight ? "light" : "dark");
        };

        // Close trailer on click outside
        els.trailerModal.addEventListener('click', (e) => {
            if (e.target === els.trailerModal) {
                closeTrailer();
            }
        });

        // Initialization
        window.addEventListener('load', () => {
            const savedTheme = localStorage.getItem("theme");
            if (savedTheme === "light") {
                document.body.classList.add("light");
                els.themeToggle.textContent = "🌙";
            } else {
                els.themeToggle.textContent = "☀️";
            }
            if (localStorage.getItem("authenticated") === "true") {
                document.getElementById("logoutContainer").style.display = "block";
                if (localStorage.getItem("showRulesOnLoad") === "true") {
                    setTimeout(() => {
                        document.getElementById("rulesOverlay").classList.add("active");
                    }, 600);
                }
            }
            loadFavorites();
        });
    </script>
</body>
</html>
